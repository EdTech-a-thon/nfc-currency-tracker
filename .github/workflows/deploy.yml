name: Test and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_POCKETBASE_URL: http://127.0.0.1:8092
      NEXT_PUBLIC_CARD_BASE_URL: https://cards.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The tests exercise the real collection rules and hooks, so they need an
      # instance running the migrations from this commit.
      - name: Start PocketBase
        run: |
          ./deploy/install-pocketbase.sh
          ./pocketbase serve --http=127.0.0.1:8092 --hooksDir=pb_hooks --migrationsDir=pb_migrations &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8092/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "PocketBase did not start" >&2
          exit 1
      - run: npm test
      - run: npm run build
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trust VM host key
        run: mkdir -p ~/.ssh && printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: Install SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: printf '%s' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'cd "${{ secrets.DEPLOY_PATH }}" && ./deploy.sh'
